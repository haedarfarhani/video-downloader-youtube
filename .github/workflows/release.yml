# Release — Official release from version tags only
# Triggers: tags starting with v*
# Requirements:
#   - Build must succeed.
#   - Tests must pass (or be skipped gracefully; workflow continues on error only if configured).
#   - Only explicit version tags trigger this; ordinary pushes never create releases.
# Safety:
#   - Uses the 'production' environment; configure required reviewers in repo settings.
#   - Does not overwrite existing releases (fails fast if tag release exists).
#   - Uses GITHUB_TOKEN with minimal scope.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest
    environment:
      name: production
      url: ${{ steps.create-release.outputs.html_url }}
    steps:
      - name: Checkout repository (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check existing release (fail fast)
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Aborting to prevent overwrite."
            "exists=true" >> $env:GITHUB_OUTPUT
            exit 1
          } else {
            Write-Host "No existing release for $tag; safe to proceed."
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet dependencies
        shell: pwsh
        run: dotnet restore VideoDownloader.WinForms.csproj

      - name: Build (Release)
        shell: pwsh
        run: dotnet build VideoDownloader.WinForms.csproj -c Release --no-restore

      - name: Run automated tests
        shell: pwsh
        run: |
          $testProject = "tests/VideoDownloader.Tests/VideoDownloader.Tests.csproj"
          if (Test-Path $testProject) {
            dotnet test $testProject -c Release --no-restore --verbosity normal
          } else {
            Write-Host "No test project found at $testProject; continuing."
          }

      - name: Determine release version from tag
        id: tag_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          if ($tag -notmatch '^v(.+)$') {
            Write-Error "Tag '${tag}' does not match 'v*' pattern. Aborting release."
            exit 1
          }
          $ver = $matches[1]
          Write-Host "Release version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          $env:RELEASE_VERSION = $ver

      - name: Publish application (win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish VideoDownloader.WinForms.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.tag_version.outputs.version }} `
            -o "publish/win-x64"

      - name: Package distributable ZIP
        shell: pwsh
        run: |
          $folderName = "VideoDownloader-win-x64"
          New-Item -ItemType Directory -Force -Path $folderName | Out-Null
          Copy-Item -Path "publish/win-x64/*" -Destination $folderName -Recurse -Force
          Compress-Archive -Path $folderName -DestinationPath "VideoDownloader-win-x64.zip" -Force
          Write-Host "Created VideoDownloader-win-x64.zip for v${env:RELEASE_VERSION}"

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use gh CLI to generate release notes automatically from merged PRs and commits.
          # This satisfies the requirement: "Generate release notes automatically from commits and merged pull requests."
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $prevTag = (git describe --tags --abbrev=0 --exclude="${tag}" 2>$null) -replace 'refs/tags/', ''
          if ([string]::IsNullOrWhiteSpace($prevTag)) {
            $prevTag = ""
          }
          # We will rely on gh release create --generate-notes, but pre-capture the output for reference.
          Write-Host "Generating notes between $prevTag and $tag (if $prevTag present)."

      - name: Create GitHub Release
        id: create-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $title = $tag
          $notes = "Automatic release for $tag. See commit history and merged pull requests for details."
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title $title `
            --generate-notes `
            --draft=false `
            "VideoDownloader-win-x64.zip"

      - name: Upload artifact (14 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-win-x64-release
          path: VideoDownloader-win-x64.zip
          retention-days: 14
          if-no-files-found: error
